name: goldenbraid-plasmid-ontology
type: graph
description: "Orchestrates a plasmid ontology load job"
params:
  schema: "./schemas/plasmid-ontology-params.json"
  values:
    ONTOLOGY_TERM: vector
    ENV: dev
    NAMESPACE: dev
    KUBE_CFG: ""

dotenv:
  - /tmp/dagu-goldenbraid.env

steps:
  - name: submit
    description: "Launch the Kubernetes job"
    command: |
      set -euo pipefail
      JOB_OUTPUT=$(just run-goldenbraid-plasmid-ontology ${TAG} ${ONTOLOGY_TERM} k8s_namespace=${NAMESPACE})
      echo "$JOB_OUTPUT"
    output: JOB_NAME

  - name: wait
    description: "Wait for Kubernetes to finish execution"
    depends: [submit]
    command: just wait-job ${JOB_NAME} k8s_namespace=${NAMESPACE}

  - name: get-logs
    description: "Fetch and print job output"
    depends: [wait]
    command: just job-logs ${JOB_NAME} k8s_namespace=${NAMESPACE}

handler_on:
  init:
    command: |
      set -euo pipefail
      if [ -n '${KUBE_CFG}' ]; then
        echo "KUBECONFIG=${KUBE_CFG}" > /tmp/dagu-goldenbraid.env
      elif [ '${ENV}' = 'dev' ]; then
        k3d kubeconfig get k3d-dev-cluster > /tmp/kubeconfig-k3d-dev.yaml
        echo "KUBECONFIG=/tmp/kubeconfig-k3d-dev.yaml" > /tmp/dagu-goldenbraid.env
      else
        echo "ERROR: KUBE_CFG must be provided for ${ENV} environment" >&2
        exit 1
      fi
  failure:
    command: |
      if [ -n "${JOB_NAME:-}" ]; then
        just job-debug "${JOB_NAME}" k8s_namespace="${NAMESPACE:-dev}"
      else
        echo "Job submission failed before a name could be captured."
      fi

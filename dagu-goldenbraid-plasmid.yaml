name: goldenbraid-plasmid
type: graph
description: "Orchestrates a GoldenBraid plasmid import job"
params:
  schema:
    type: object
    required: ["TAG", "EMAIL"]
    properties:
      TAG:
        type: string
        description: "The Docker image tag to use"
      EMAIL:
        type: string
        description: "The email address for the import"
      ENV:
        type: string
        description: "Target environment (dev, staging, production)"
        default: "dev"
      NAMESPACE:
        type: string
        description: "Kubernetes namespace"
        default: "dev"
      KUBE_CFG:
        type: string
        description: "Path to kubeconfig file (required for non-dev)"
        default: ""

env:
  - KUBECONFIG: >-
      `if [ -n '${KUBE_CFG}' ]; then
        echo '${KUBE_CFG}';
      elif [ '${ENV}' = 'dev' ]; then
        k3d kubeconfig write k3d-dev-cluster;
      else
        echo 'ERROR: KUBE_CFG must be provided for ${ENV} environment' >&2;
        exit 1;
      fi`

steps:
  - name: submit
    description: "Launch the Kubernetes job"
    command: |
      set -euo pipefail
      JOB_OUTPUT=$(just run-goldenbraid ${TAG} ${EMAIL} k8s_namespace=${NAMESPACE})
      echo "$JOB_OUTPUT"
    output: JOB_NAME

  - name: wait
    description: "Wait for Kubernetes to finish execution"
    depends: [submit]
    command: just wait-job ${JOB_NAME} k8s_namespace=${NAMESPACE}

  - name: get-logs
    description: "Fetch and print job output"
    depends: [wait]
    command: just job-logs ${JOB_NAME} k8s_namespace=${NAMESPACE}

handler_on:
  failure:
    command: |
      if [ -n "${JOB_NAME:-}" ]; then
        just job-debug "${JOB_NAME}" k8s_namespace="${NAMESPACE:-dev}"
      else
        echo "Job submission failed before a name could be captured."
      fi

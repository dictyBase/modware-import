name: goldenbraid-plasmid
type: graph
description: "Orchestrates a GoldenBraid plasmid import job in the dev cluster."
params:
  schema:
    type: object
    required: ["TAG", "EMAIL"]
    properties:
      TAG:
        type: string
        description: "The Docker image tag to use"
      EMAIL:
        type: string
        description: "The email address for the import"

steps:
  - name: submit
    description: "Launch the Kubernetes job"
    command: |
      set -euo pipefail
      JOB_OUTPUT=$(just run-goldenbraid ${TAG} ${EMAIL})
      echo "goldenbraid-plasmid"
    output: JOB_NAME

  - name: wait
    description: "Wait for Kubernetes to finish execution"
    depends: [submit]
    command: just wait-job ${JOB_NAME}

  - name: get-logs
    description: "Fetch and print job output"
    depends: [wait]
    command: just job-logs ${JOB_NAME}

handler_on:
  failure:
    command: |
      if [ -n "${JOB_NAME:-}" ]; then
        just job-debug "${JOB_NAME}"
      else
        echo "Job submission failed before a name could be captured."
      fi

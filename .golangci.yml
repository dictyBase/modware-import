version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - forbidigo
    - funlen
    - funcorder
    - goconst
    - gocyclo
    - gosec
    - govet
    - gocognit
    - ineffassign
    - importas
    - inamedparam
    - interfacebloat
    - lll
    - loggercheck
    - misspell
    - mnd
    - nakedret
    - nestif
    - revive
    - recvcheck
    - staticcheck
    - unconvert
    - usestdlibvars
    - unparam
    - unused
    - whitespace
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # Point-free Flap and Flip hide a plain call f(x) or a plain
        # argument order. Write a named function. An endomorphism
        # builder uses endoutils.BuildFrom, which is not flagged.
        - pattern: ^(array|identity|option|either|io|ioeither|function)\.(Flap|MonadFlap)$
          pkg: ^github\.com/IBM/fp-go/v2/
          msg: "point-free Flap: write a named plain function that calls f(x)"
        - pattern: ^function\.Flip$
          pkg: ^github\.com/IBM/fp-go/v2/function$
          msg: "F.Flip: write a named plain function with the argument order you need"
    goconst:
      ignore-tests: true
    govet:
      disable:
        - inline
    funlen:
      lines: 80
      statements: 50
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/baserow/
      - internal/k8s/
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
